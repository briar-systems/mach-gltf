[project]
id = "gltf"
version = "0.8.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.windows]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.darwin]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.gltf]
kind = "static"
entry = "lib/gltf.mach"
out = "{project.work}/lib/libgltf{artifact.suffix}"
targets = ["*"]
link = []
need = []
default = true
export = true

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.json]
git = "https://github.com/briar-systems/mach-json"
ref = "branch/dev"
